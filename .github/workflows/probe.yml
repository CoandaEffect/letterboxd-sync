name: Temporary reachability probe
on:
  push:
    branches: [fix/reliable-sync]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install curl-cffi==0.17.0
      - run: |
          python -u - <<'PY'
          import urllib.request
          from curl_cffi import requests
          urls = [
              'https://letterboxd.com/coanda_effect/films/page/1/',
              'https://letterboxd.com/coanda_effect/films/page/2/',
              'https://letterboxd.com/coanda_effect/films/diary/',
          ]
          for client in ['urllib', 'chrome', 'safari', 'firefox']:
              for url in urls:
                  try:
                      if client == 'urllib':
                          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(req, timeout=15) as response:
                              status, body = response.status, response.read().decode()
                      else:
                          response = requests.get(url, impersonate=client, timeout=15)
                          status, body = response.status_code, response.text
                      valid = 'diary-table' in body if '/diary/' in url else ('griditem' in body or 'poster-container' in body)
                      print(client, url, status, 'valid_data=', valid, flush=True)
                  except Exception as e:
                      print(client, url, type(e).__name__, str(e), flush=True)
          PY
