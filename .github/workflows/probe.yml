name: Temporary reachability probe
on:
  push:
    branches: [fix/reliable-sync]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright curl-cffi==0.17.0
      - run: playwright install chromium --with-deps
      - run: |
          xvfb-run -a python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          from curl_cffi import requests
          urls = [
              'https://letterboxd.com/coanda_effect/films/',
              'https://letterboxd.com/coanda_effect/films/by/date/',
              'https://letterboxd.com/coanda_effect/films/by/date/page/2/',
              'https://letterboxd.com/coanda_effect/rss/',
          ]
          for url in urls:
              try:
                  r = requests.get(url, impersonate='chrome', timeout=15)
                  print('HTTP', url, r.status_code, 'valid=', 'griditem' in r.text or '<rss' in r.text, flush=True)
              except Exception as e:
                  print(type(e).__name__, str(e), flush=True)
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=False)
              page = browser.new_page()
              for url in [urls[0], 'https://letterboxd.com/coanda_effect/films/page/2/', 'https://letterboxd.com/coanda_effect/films/diary/']:
                  try:
                      r = page.goto(url, wait_until='domcontentloaded', timeout=30000)
                      print('Browser initial:', url, r.status if r else None, page.title(), flush=True)
                      try:
                          page.wait_for_selector('li.griditem, li.poster-container, #diary-table', timeout=20000)
                      except Exception:
                          pass
                      body = page.content()
                      print('Browser result:', page.url, page.title(), 'valid=', 'griditem' in body or 'diary-table' in body, flush=True)
                  except Exception as e:
                      print(type(e).__name__, str(e), flush=True)
              browser.close()
          PY
