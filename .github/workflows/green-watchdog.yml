name: Green App health watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_case:
        description: "Alert delivery check (fixtures only; public health is never changed)"
        type: choice
        default: none
        options:
          - none
          - missing-heartbeat
          - overdue-success

permissions:
  contents: read

jobs:
  health:
    name: Check Green heartbeat and successful sync
    if: github.event_name == 'workflow_dispatch' || vars.GREEN_WATCHDOG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read public health record from green-status
        if: github.event_name != 'workflow_dispatch' || inputs.test_case == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail --silent --show-error --max-time 20 --max-filesize 65536
          --proto '=https' --tlsv1.2
          --header "Authorization: Bearer $GH_TOKEN"
          --header 'Accept: application/vnd.github.raw+json'
          --header 'X-GitHub-Api-Version: 2022-11-28'
          'https://api.github.com/repos/CoandaEffect/letterboxd-sync/contents/health.json?ref=green-status'
          --output "$RUNNER_TEMP/green-health.json"
      - name: Validate public heartbeat and due success
        if: github.event_name != 'workflow_dispatch' || inputs.test_case == 'none'
        run: python tools/check_green_health.py "$RUNNER_TEMP/green-health.json"
      - name: Exercise isolated alert failure fixture
        if: github.event_name == 'workflow_dispatch' && inputs.test_case != 'none'
        env:
          TEST_CASE: ${{ inputs.test_case }}
        run: python tools/check_green_health.py --test-case "$TEST_CASE"
