name: Test scraper and Green

on:
  push:
    paths: ["scrape.py", "green_app/**", "tools/**", "tests/**", "config/green-watcher/**", "requirements.txt", "requirements-test.txt", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.6"
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt -r green_app/requirements.txt -r requirements-test.txt
      - run: .venv/bin/python -m unittest discover -s tests -v > test-results.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tests-${{ github.sha }}
          path: test-results.txt
