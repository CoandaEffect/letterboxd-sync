name: Sync Letterboxd watched films

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 */2 * *"  # Odd-numbered days at 6 AM UTC; GitHub may delay runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letterboxd-sync
  cancel-in-progress: false

jobs:
  sync:
    # Set this repository variable to a runner label on an allowed network.
    # Linux, macOS (ARM/Intel), and Windows hosted pools were all blocked.
    runs-on: ${{ vars.LETTERBOXD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Letterboxd
        env:
          LETTERBOXD_PROXY: ${{ secrets.LETTERBOXD_PROXY }}
        run: python -u scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add letterboxd-watched.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update watched films $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summarize failure
        if: failure()
        run: |
          echo '::error::Letterboxd sync did not complete. Check the failed step before relying on export freshness.'
          echo 'Sync failed. Check the failed step above. For blocked requests, configure an allowed network using LETTERBOXD_RUNNER or LETTERBOXD_PROXY. GitHub Actions failure emails may be filtered as spam; allow notifications@github.com in your mail settings.' >> "$GITHUB_STEP_SUMMARY"
